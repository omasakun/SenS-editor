<!DOCTYPE html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="description" content=".SenS / SenS2 Note Editor">
	<meta name="author" content="omasakun">
	<title>SenS Editor</title>
	<link rel="stylesheet" href="common/common.css">
	<script src="common/common.js"></script>
	<script src="index.js"></script>
	<style>
		hr {
			width: 100%;
			color: #AAA;
		}

		html {
			height: 100%;
		}

		body {
			padding: 0 0.5em;
			height:100%;
			line-height: 1.2;
			overflow: hidden;
		}

		.max5 {
			max-width: 5em;
			min-width: 1em;
		}

		.max3 {
			max-width: 3em;
			min-width: 1em;
		}

		.margin-grid {
			margin: 0 .5em;
		}
	</style>
</head>
<!-- 
Button score-up score-down music-up grid-add ctrl-snap ctrl-play
Div    grids
Input  ctrl-sec ctrl-window ctrl-lanes
Canvas canvas
Span   score-name music-name
-->

<body class="cV">
	<!-- something -->
	<div>
		<div class="cH cWrap">
			<div class="framed">Score:
				<span id="score-name">unselected</span>
				<button class="fa fa-upload hover" id="score-up"></button>
				<button class="fa fa-download hover" id="score-down"></button>
			</div>
			<div class="grow" style="max-width:5em"></div>
			<div class="framed">Music:
				<span id="music-name">unselected</span>
				<button class="fa fa-upload hover" id="music-up"></button>
			</div>
		</div>
		<hr>
		<button class="fa fa-plus-circle" id="grid-add"></button>Grids
		<div class="cH cWrap fullW" id="grid">
		</div>
		<hr>
		<div class="cH cWrap">
			<div class="framed">
				<input type="text" class="max5" id="ctrl-sec">ms
			</div>
			<div class="max3 grow"></div>
			<div class="framed">Window:
				<input type="text" class="max5" id="ctrl-window">
			</div>
			<div class="max3 grow"></div>
			<div class="framed">Snap-
				<button id="ctrl-snap">YES</button>
			</div>
			<div class="max3 grow"></div>
			<div class="framed">
				<input type="text" class="max5" id="ctrl-lanes" value="5">lanes</div>
			<button id="ctrl-play">PLAY</button>
		</div>
	</div>
	<div id="canvas-parent" class="fullW grow">
		<canvas id="canvas"></canvas>
	</div>
	<style>
		@import url('https://fonts.googleapis.com/earlyaccess/notosansjapanese.css');
		@import url('https://fonts.googleapis.com/css?family=Open+Sans:300,700');
		@import url('https://fonts.googleapis.com/earlyaccess/kokoro.css');
		@import url('https://fonts.googleapis.com/earlyaccess/roundedmplus1c.css');
		@import url('./font-awesome-4.7.0/css/font-awesome.min.css');
	</style>
</body>
